architecture:
  name: pet
  model:
    cutoff: 4.5
    num_neighbors_adaptive: null
    adaptive_cutoff_method: solver
    cutoff_function: Bump
    cutoff_width: 0.5
    d_pet: 128
    d_head: 128
    d_node: 256
    d_feedforward: 256
    num_heads: 8
    num_attention_layers: 2
    num_gnn_layers: 2
    normalization: RMSNorm
    activation: SwiGLU
    attention_temperature: 1.0
    transformer_type: PreLN
    featurizer_type: feedforward
    zbl: false
    long_range:
      enable: false
      use_ewald: false
      smearing: 1.4
      kspace_resolution: 1.33
      interpolation_nodes: 5
  training:
    distributed: false
    distributed_port: 39591
    batch_size: 16
    num_epochs: 1000
    warmup_fraction: 0.01
    learning_rate: 0.0001
    weight_decay: null
    log_interval: 1
    checkpoint_interval: 100
    atomic_baseline: {}
    scale_targets: true
    fixed_scaling_weights: {}
    per_structure_targets: []
    num_workers: null
    log_mae: true
    log_separate_blocks: false
    best_model_metric: mae_prod
    grad_clip_norm: 1.0
    loss: mse
    batch_atom_bounds:
    - null
    - null
    max_atoms_per_batch: null
    min_atoms_per_batch: 0
    finetune:
      read_from: null
      method: full
      config: {}
      inherit_heads: {}

# this needs specifying based on the specific dataset
training_set:
  systems:
    read_from: debug/ethanol_reduced_100.xyz
    length_unit: Angstrom
  targets:
    energy:
      key: energy  # name of the target value
      unit: eV  # unit of the target value

test_set: 0.1  # 10 % of the training_set are randomly split and taken for test set
validation_set: 0.1  # 